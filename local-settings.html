<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News Feed Pulse — Local settings</title>
    <link rel="stylesheet" href="local-settings.css">
  </head>
  <body>
    <main>
      <header>
        <img src="extension-icons/icon48x48.png" alt="">
        <div><h1>News Feed Pulse</h1><p>Local-only RSS settings</p></div>
      </header>

      <section>
        <h2>Add an RSS or Atom feed</h2>
        <p>Paste a direct feed URL or a webpage that lists feeds. Everything is checked by the extension itself.</p>
        <form id="add-feed-form">
          <label for="feed-url">Website or feed URL</label>
          <div class="row">
            <input id="feed-url" name="feedUrl" type="text" inputmode="url" required placeholder="https://example.com/feed.xml">
            <button id="find-feeds" type="submit">Find feeds</button>
          </div>
          <output id="feed-status" aria-live="polite"></output>
          <div id="feed-results" class="feed-results"></div>
        </form>
      </section>

      <section>
        <h2>In-page notifications</h2>
        <label class="check"><input id="toast-enabled" type="checkbox"> Show a toast when a new item arrives</label>
        <div class="fields">
          <label for="toast-position">Screen corner</label>
          <select id="toast-position">
            <option value="top-right">Top right (default)</option>
            <option value="top-left">Top left</option>
            <option value="bottom-right">Bottom right</option>
            <option value="bottom-left">Bottom left</option>
          </select>
          <label for="toast-duration">Visible for</label>
          <select id="toast-duration">
            <option value="3000">3 seconds</option><option value="5000">5 seconds</option>
            <option value="8000">8 seconds</option>
            <option value="12000">12 seconds</option><option value="20000">20 seconds</option>
            <option value="60000">1 minute</option><option value="300000" selected>5 minutes (default)</option>
          </select>
          <label for="poll-interval">Check for news</label>
          <select id="poll-interval">
            <option value="5" selected>Every 5 minutes (default)</option><option value="15">Every 15 minutes</option>
            <option value="30">Every 30 minutes</option><option value="60">Every hour</option>
          </select>
          <label for="max-posts">Keep per feed</label>
          <select id="max-posts">
            <option value="50" selected>50 posts (default)</option><option value="100">100 posts</option>
            <option value="150">150 posts</option><option value="300">300 posts</option>
          </select>
        </div>
        <div class="actions">
          <button id="save-settings" type="button">Save settings</button>
          <button id="test-toast" class="secondary" type="button">Test toast</button>
          <a href="popup.html" target="_blank">Open reader</a>
        </div>
        <output id="settings-status" aria-live="polite"></output>
      </section>

      <section>
        <div class="section-heading"><div><h2>Subscribed feeds</h2><p>Feeds and posts are stored only in this browser profile.</p></div><button id="refresh-feeds" class="secondary" type="button">Refresh all</button></div>
        <div id="saved-feeds" class="saved-feeds"></div>
      </section>

    </main>
    <script src="local-settings.js"></script>
  </body>
</html>
