<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toast notification position</title>
  <link rel="stylesheet" href="toast-settings.css">
</head>
<body>
  <main>
    <div class="brand"><img src="extension-icons/icon48x48.png" alt=""><span>RSS Feed Reader Lite</span></div>
    <h1>Toast notifications</h1>
    <p class="intro">Choose where feed notifications appear in the current browser tab. The default is top right.</p>
    <fieldset>
      <legend>Screen position</legend>
      <div class="choices">
        <label><input type="radio" name="position" value="top-right"><span class="preview top-right"></span><strong>Top right</strong></label>
        <label><input type="radio" name="position" value="top-left"><span class="preview top-left"></span><strong>Top left</strong></label>
        <label><input type="radio" name="position" value="bottom-right"><span class="preview bottom-right"></span><strong>Bottom right</strong></label>
        <label><input type="radio" name="position" value="bottom-left"><span class="preview bottom-left"></span><strong>Bottom left</strong></label>
      </div>
    </fieldset>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="toast-settings.js"></script>
</body>
</html>
